name: Documentation Issue
description: Report missing, outdated or unclear documentation for fft.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in fft
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Scenario execution, Lua test steps, Gameplay recording and
      replay, JSON reports.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
